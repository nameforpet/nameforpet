<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="100" height="100" rx="24" fill="url(#grad)" />
  <!-- Paw Print in White -->
  <g fill="#ffffff" filter="url(#shadow)">
    <!-- Main central pad -->
    <path d="M 50 48 C 42 48 34 56 36 67 C 37 73 43 78 50 78 C 57 78 63 73 64 67 C 66 56 58 48 50 48 Z" />
    <!-- Toe 1 (left-most) -->
    <ellipse cx="30" cy="46" rx="6.5" ry="9" transform="rotate(-25 30 46)" />
    <!-- Toe 2 (mid-left) -->
    <ellipse cx="43" cy="36" rx="6.5" ry="9.5" transform="rotate(-8 43 36)" />
    <!-- Toe 3 (mid-right) -->
    <ellipse cx="57" cy="36" rx="6.5" ry="9.5" transform="rotate(8 57 36)" />
    <!-- Toe 4 (right-most) -->
    <ellipse cx="70" cy="46" rx="6.5" ry="9" transform="rotate(25 70 46)" />
  </g>
  <!-- Sparkle Accent -->
  <path d="M 76 22 L 78 27 L 83 29 L 78 31 L 76 36 L 74 31 L 69 29 L 74 27 Z" fill="#fef08a" opacity="0.95" />
</svg>